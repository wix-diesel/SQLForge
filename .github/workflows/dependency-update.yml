name: Dependency Update Check

on:
  schedule:
    # 毎週月曜 9:00 JST (= 00:00 UTC)
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-nuget-packages:
    name: NuGetパッケージの更新確認
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PR作成に GITHUB_TOKEN を使うと、生成された PR は CI (ci.yml) を自動起動しない。
          # PR上でCIを自動実行したい場合は、リポジトリに repo 権限を持つ PAT を
          # secrets.DEPENDENCY_UPDATE_PAT として登録すること（未設定なら GITHUB_TOKEN にフォールバック）。
          token: ${{ secrets.DEPENDENCY_UPDATE_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Git設定
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 依存パッケージの更新を確認しPRを作成
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_UPDATE_PAT || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_nuget_packages.py
