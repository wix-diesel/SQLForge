name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SQLForge.sln

      - name: Build
        run: dotnet build SQLForge.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SQLForge.sln --configuration Release --no-build
